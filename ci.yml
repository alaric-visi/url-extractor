# Move this file to .github/workflows/ci.yml (the tool that wrote it can't create files under .github).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Keep the Playwright report when end-to-end tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
